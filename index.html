<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cantinho da Leitura</title>
<meta name="description" content="Os livros que eu li, estou lendo e quero ler.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%237c2d33'/><path d='M4 7c0 0 2.2-1.3 5-1 1.3.15 2.7.75 3 .9.3-.15 1.7-.75 3-.9 2.8-.3 5 1 5 1v10.6c0 0-2.2-1.1-5-.8-1.3.1-2.7.7-3 .85-.3-.15-1.7-.75-3-.85-2.8-.3-5 .8-5 .8V7Z' fill='none' stroke='%23fdf6ec' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/><path d='M12 6.9V17.5' stroke='%23fdf6ec' stroke-width='1.5' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=2">
</head>
<body>
<header class="site-header reveal">
  <a class="top-link" href="admin.html">
    <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    editar
  </a>
  <div class="brand">
    <div class="icon-badge">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7c0 0 2.2-1.3 5-1 1.3.15 2.7.75 3 .9.3-.15 1.7-.75 3-.9 2.8-.3 5 1 5 1v10.6c0 0-2.2-1.1-5-.8-1.3.1-2.7.7-3 .85-.3-.15-1.7-.75-3-.85-2.8-.3-5 .8-5 .8V7Z"/><path d="M12 6.9V17.5"/></svg>
    </div>
    <h1>Cantinho da Leitura</h1>
  </div>
  <p class="kicker">um registro pessoal de leituras</p>
  <blockquote class="quote" id="quote">
    <p id="quote-text">Carregando…</p>
    <cite id="quote-author"></cite>
  </blockquote>
</header>

<main class="wrap">

  <section class="hero-grid reveal">
    <div class="card reading-card">
      <div class="cover" id="reading-cover"></div>
      <div>
        <div class="label" id="reading-label">Lendo agora</div>
        <h3 id="reading-title">—</h3>
        <div class="author" id="reading-author"></div>
        <div class="progress-track"><div class="progress-fill" id="reading-progress-fill" style="width:0%"></div></div>
        <div class="progress-label" id="reading-progress-label"></div>
      </div>
    </div>
    <div class="side-cards">
      <div class="card mini-card">
        <div class="label">Próxima leitura</div>
        <div class="value" id="next-up">—</div>
      </div>
      <div class="card mini-card">
        <div class="label">Nota média no ano</div>
        <div class="value" id="avg-rating">—</div>
      </div>
    </div>
  </section>

  <div class="stats-grid fade-swap" id="stats-grid"></div>

  <div class="year-tabs" id="year-tabs"></div>

  <h2 class="section-title">Lidos <span class="rule"></span><span class="count" id="read-count"></span></h2>
  <div class="book-grid fade-swap" id="read-grid"></div>

  <div class="charts-grid fade-swap" id="charts-grid">
    <div class="viz-root viz-wrap">
      <h4>Livros por mês</h4>
      <div id="chart-months"></div>
    </div>
    <div class="viz-root viz-wrap">
      <h4>Distribuição de notas</h4>
      <div id="chart-ratings"></div>
    </div>
  </div>

  <h2 class="section-title">Abandonados <span class="rule"></span><span class="count" id="abandoned-count"></span></h2>
  <div class="simple-list fade-swap" id="abandoned-list"></div>

  <h2 class="section-title">Pretendo ler <span class="rule"></span></h2>
  <div class="simple-list" id="want-list"></div>

  <h2 class="section-title">Desejo comprar <span class="rule"></span></h2>
  <div class="simple-list" id="wishlist-list"></div>

</main>

<footer class="site-footer">
  <p>“Um cantinho para guardar histórias.”</p>
</footer>

<script src="assets/common.js?v=2"></script>
<script src="assets/app.js?v=2"></script>
</body>
</html>
